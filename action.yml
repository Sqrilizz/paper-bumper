name: "Paper Bumper"
description: "Automatically bumps Minecraft Paper and Purpur plugin versions with headless server smoke testing"
author: "Sqrilizz"
branding:
  icon: "refresh-cw"
  color: "green"

inputs:
  project-dir:
    description: "Path to project root containing build.gradle(.kts) or pom.xml"
    required: false
    default: "."
  software:
    description: "Server software to check (paper or purpur)"
    required: false
    default: "paper"
  channel:
    description: "Release channel (STABLE, EXPERIMENTAL, ALL)"
    required: false
    default: "STABLE"
  target-version:
    description: "Explicit target Minecraft version to bump to (e.g. 26.3). Defaults to latest"
    required: false
  smoke-test:
    description: "Whether to run headless server smoke test after compiling"
    required: false
    default: "true"
  test-commands:
    description: "Comma-separated list of console commands to run during smoke test"
    required: false
    default: "version,plugins"
  timeout:
    description: "Smoke test server timeout in seconds"
    required: false
    default: "120"
  auto-pr:
    description: "Automatically create a pull request if updates are found and smoke test passes"
    required: false
    default: "true"
  author-name:
    description: "Git commit author name"
    required: false
    default: "github-actions[bot]"
  author-email:
    description: "Git commit author email"
    required: false
    default: "github-actions[bot]@users.noreply.github.com"
  github-token:
    description: "GitHub token for branch creation and pull request submission"
    required: false
    default: ${{ github.token }}

outputs:
  has_update:
    description: "Whether a new version was found"
    value: ${{ steps.run_bumper.outputs.has_update }}
  current_version:
    description: "Current plugin target version"
    value: ${{ steps.run_bumper.outputs.current_version }}
  target_version:
    description: "New target Minecraft version"
    value: ${{ steps.run_bumper.outputs.target_version }}
  build_id:
    description: "Downloaded server build id"
    value: ${{ steps.run_bumper.outputs.build_id }}
  smoke_test_success:
    description: "Whether the headless smoke test succeeded"
    value: ${{ steps.run_bumper.outputs.smoke_test_success }}
  summary_file:
    description: "Path to generated summary markdown file"
    value: ${{ steps.run_bumper.outputs.summary_file }}

runs:
  using: "composite"
  steps:
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache Cargo Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ github.action_path }}/target
        key: cargo-paper-bumper-${{ runner.os }}-${{ hashFiles(format('{0}/Cargo.lock', github.action_path)) }}
        restore-keys: |
          cargo-paper-bumper-${{ runner.os }}-

    - name: Build paper-bumper binary
      shell: bash
      run: |
        cd "${{ github.action_path }}"
        cargo build --release

    - name: Run paper-bumper
      id: run_bumper
      shell: bash
      env:
        GITHUB_OUTPUT: ${{ github.output }}
      run: |
        CMD=("${{ github.action_path }}/target/release/paper-bumper" "run" "--project-dir" "${{ inputs.project-dir }}" "--software" "${{ inputs.software }}" "--channel" "${{ inputs.channel }}" "--timeout" "${{ inputs.timeout }}")

        if [ -n "${{ runner.temp }}" ]; then
          CMD+=("--work-dir" "${{ runner.temp }}/paper-bumper-smoke")
        fi

        if [ -n "${{ inputs.target-version }}" ]; then
          CMD+=("--target-version" "${{ inputs.target-version }}")
        fi

        if [ "${{ inputs.smoke-test }}" != "true" ]; then
          CMD+=("--skip-smoke")
        fi

        if [ -n "${{ inputs.test-commands }}" ]; then
          CMD+=("--commands" "${{ inputs.test-commands }}")
        fi

        "${CMD[@]}"

    - name: Create Pull Request and Post Comment
      if: ${{ inputs.auto-pr == 'true' && steps.run_bumper.outputs.has_update == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        NEW_VER: ${{ steps.run_bumper.outputs.target_version }}
        BUILD_ID: ${{ steps.run_bumper.outputs.build_id }}
        SOFTWARE: ${{ inputs.software }}
        AUTHOR_NAME: ${{ inputs.author-name }}
        AUTHOR_EMAIL: ${{ inputs.author-email }}
        SUMMARY_FILE: ${{ steps.run_bumper.outputs.summary_file }}
      run: |
        git config user.name "$AUTHOR_NAME"
        git config user.email "$AUTHOR_EMAIL"
        BRANCH="bump/${SOFTWARE}-${NEW_VER}"

        git checkout -b "$BRANCH" 2>/dev/null || git checkout "$BRANCH"
        git add -u
        git commit -m "chore: bump ${SOFTWARE} to ${NEW_VER} (build ${BUILD_ID})" || true
        git push origin "$BRANCH" --force

        PR_URL=$(gh pr list --head "$BRANCH" --json url --jq '.[0].url')
        if [ -z "$PR_URL" ]; then
          PR_URL=$(gh pr create \
            --title "chore: bump ${SOFTWARE} to ${NEW_VER}" \
            --body-file "$SUMMARY_FILE" \
            --base main \
            --head "$BRANCH")
        else
          gh pr edit "$PR_URL" --body-file "$SUMMARY_FILE"
        fi

        gh pr comment "$PR_URL" --body-file "$SUMMARY_FILE"
